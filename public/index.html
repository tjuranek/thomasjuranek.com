        flex-wrap: wrap;
        gap: 0.35rem 1.15rem;

        padding: 0;
        list-style: none;

        text-underline-offset: 0.18em;
        text-decoration-thickness: 1px;
        text-decoration-color: color-mix(in srgb, var(--ink) 35%, transparent);

      a:hover {
        color: var(--focus);
        text-decoration-color: var(--focus);
      }

      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
        border-radius: 2px;
      }

          padding-top: 18vh;
